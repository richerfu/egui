[package]
name = "accesskit_ohos"
version = "0.1.0"
authors = ["The AccessKit contributors"]
license = "MIT OR Apache-2.0"
description = "AccessKit UI accessibility infrastructure: OpenHarmony adapter"
categories = ["gui", "accessibility"]
keywords = ["gui", "ui", "accessibility", "openharmony"]
repository = "https://github.com/richerfu/accesskit"
readme = "README.md"
edition = "2021"
rust-version = "1.88"

[features]
default = ["api-13"]
api-13 = ["ohos-accessibility-binding/api-13"]
api-14 = ["api-13", "ohos-accessibility-binding/api-14"]
api-15 = ["api-14", "ohos-accessibility-binding/api-15"]
api-16 = ["api-15", "ohos-accessibility-binding/api-16"]
api-17 = ["api-16", "ohos-accessibility-binding/api-17"]
api-18 = ["api-17", "ohos-accessibility-binding/api-18"]
api-19 = ["api-18", "ohos-accessibility-binding/api-19"]
api-20 = ["api-19", "ohos-accessibility-binding/api-20"]
api-21 = ["api-20", "ohos-accessibility-binding/api-21"]
api-22 = ["api-21", "ohos-accessibility-binding/api-22"]
api-23 = ["api-22", "ohos-accessibility-binding/api-23"]
api-24 = ["api-23", "ohos-accessibility-binding/api-24"]

[target.'cfg(target_env = "ohos")'.dependencies]
accesskit = "0.21.1"
accesskit_consumer = "0.31.0"
ohos-accessibility-binding = { version = "0.1.0", default-features = false }
